name: Cập nhật văn bản thuốc bảo vệ thực vật

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lấy văn bản mới từ nguồn chính thức
        run: python scripts/update_legal.py
      - name: Lưu dữ liệu khi có thay đổi
        run: |
          git config user.name "agrotech-legal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add legal-updates.json
          git diff --cached --quiet || git commit -m "Tự động cập nhật văn bản thuốc BVTV"
          git push
