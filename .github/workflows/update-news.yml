name: Cập nhật tin sâu bệnh và giá vật tư

on:
  schedule:
    - cron: "17 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lấy các bản tin mới nhất
        run: |
          python scripts/update_news.py
          python scripts/update_market.py
      - name: Lưu dữ liệu khi có thay đổi
        run: |
          git config user.name "agrotech-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add news-data.json market-data.json
          git diff --cached --quiet || git commit -m "Tự động cập nhật tin sâu bệnh và giá vật tư"
          git push
