name: Deploy Zalo Bot Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "zalo-bot-worker/**"
      - ".github/workflows/deploy-zalo-worker.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: zalo-bot-worker
          command: deploy
