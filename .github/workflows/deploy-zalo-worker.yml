name: Deploy Zalo Bot Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "zalo-bot-worker/**"
      - ".github/workflows/deploy-zalo-worker.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Worker dependencies
        working-directory: zalo-bot-worker
        run: npm ci

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: zalo-bot-worker
          command: deploy

      - name: Synchronize Zalo webhook secret
        working-directory: zalo-bot-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ZALO_SECRET_TOKEN: ${{ secrets.ZALO_SECRET_TOKEN }}
        run: printf '%s' "$ZALO_SECRET_TOKEN" | npx wrangler secret put ZALO_SECRET_TOKEN
