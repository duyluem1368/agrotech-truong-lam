*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#071713;color:#eafff1;font-family:Inter,system-ui,sans-serif}#app{height:100%;position:relative}canvas{display:block}.hud{position:absolute;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;align-items:flex-start;padding:18px 22px}.brand{background:#061b16d9;border:1px solid #3c956d;border-radius:16px;padding:14px 18px;box-shadow:0 12px 40px #0006}.title{font-size:clamp(19px,3vw,32px);font-weight:850;letter-spacing:-.04em;color:#d9ffe6}.sub{color:#9bcfb1;margin-top:4px}.pill{background:#0d3627e8;border:1px solid #5bc885;border-radius:999px;padding:10px 14px;color:#a8ffd0;font-weight:700}.toolbar{position:absolute;left:20px;bottom:20px;display:flex;gap:8px;pointer-events:auto;flex-wrap:wrap}.toolbar button{border:1px solid #4e9d78;background:#08271cdd;color:#d9ffe6;border-radius:10px;padding:10px 13px;cursor:pointer}.toolbar button:hover{background:#145338}.panel{position:absolute;right:20px;top:92px;width:min(355px,calc(100vw - 40px));background:#061a15ee;border:1px solid #4c9a75;border-radius:16px;padding:18px;pointer-events:auto;box-shadow:0 18px 60px #0009;backdrop-filter:blur(14px);display:none}.panel h2{margin:0 0 5px;color:#caffd8}.panel p{color:#a7cdb4;line-height:1.45}.tag{display:inline-block;padding:5px 8px;border-radius:8px;background:#164e35;color:#baffd2;font-size:12px;margin:3px 3px 0 0}.close{float:right;border:0;background:none;color:#b5d9c4;font-size:22px;cursor:pointer}.hint{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);background:#061a15d9;border:1px solid #3d805f;border-radius:999px;padding:9px 15px;color:#a7ccb4;white-space:nowrap;font-size:12px}.legend{position:absolute;left:20px;top:104px;background:#061a15cc;border:1px solid #2e684d;border-radius:12px;padding:10px 12px;color:#a9cfb5;font-size:12px;line-height:1.8}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}.sen{background:#f0b8c3}.sung{background:#ffdc62}.free{background:#79cde4}.build{background:#e5c184}@media(max-width:650px){.legend{display:none}.hint{bottom:72px;font-size:10px}.top{padding:10px}.pill{font-size:11px}.brand{padding:10px}}
</style></head><body><div id="app"><div class="hud"><div class="top"><div class="brand"><div class="title">HỌC VIỆN NÔNG NGHIỆP SỐ</div><div class="sub">Mô hình 3D học tập mô phỏng VNUA · Gia Lâm, Hà Nội</div></div><div class="pill">● 4 hồ · tuyến tham quan mở</div></div><div class="legend"><div><i class="dot sen"></i>Hồ hoa sen</div><div><i class="dot sung"></i>Hồ hoa súng</div><div><i class="dot free"></i>Hồ tự nhiên</div><div><i class="dot build"></i>Công trình học tập</div></div><div class="panel" id="panel"><button class="close" id="close">×</button><h2 id="pTitle"></h2><div id="pBody"></div></div><div class="toolbar"><button data-view="gate">Cổng trường</button><button data-view="admin">Trung tâm hành chính</button><button data-view="agro">Khoa Nông học</button><button data-view="garden">Vườn thực hành</button></div><div class="hint">Kéo để tham quan · Cuộn để zoom · Bấm vào địa điểm để tìm hiểu</div></div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.161/examples/jsm/controls/OrbitControls.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#9bc8b0');scene.fog=new THREE.Fog('#9bc8b0',85,170);const cam=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,300);cam.position.set(38,32,47);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.getElementById('app').prepend(renderer.domElement);const controls=new OrbitControls(cam,renderer.domElement);controls.target.set(0,0,0);controls.enableDamping=true;controls.maxPolarAngle=Math.PI/2.05;controls.minDistance=16;controls.maxDistance=145;
scene.add(new THREE.HemisphereLight('#e7fff1','#3d6747',2.2));const sun=new THREE.DirectionalLight('#fff4d6',2.5);sun.position.set(-35,60,25);sun.castShadow=true;scene.add(sun);
const clickable=[];const mats={grass:new THREE.MeshStandardMaterial({color:'#4f9a57'}),road:new THREE.MeshStandardMaterial({color:'#4a514b'}),water:new THREE.MeshStandardMaterial({color:'#3b9dad',transparent:true,opacity:.86,roughness:.18}),wall:new THREE.MeshStandardMaterial({color:'#d8bc83'}),roof:new THREE.MeshStandardMaterial({color:'#9d4f38'}),green:new THREE.MeshStandardMaterial({color:'#2d7d4a'}),trunk:new THREE.MeshStandardMaterial({color:'#6b4930'}),soil:new THREE.MeshStandardMaterial({color:'#784d2d'}),leaf:new THREE.MeshStandardMaterial({color:'#55a957'}),flowerPink:new THREE.MeshStandardMaterial({color:'#f1a7bd'}),flowerYellow:new THREE.MeshStandardMaterial({color:'#ffe071'})};
function box(name,x,y,z,w,h,d,mat,info){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;o.userData={name,info};scene.add(o);if(info)clickable.push(o);return o}function cyl(name,x,y,z,r,h,mat,info){const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r*.9,h,12),mat);o.position.set(x,y,z);o.castShadow=true;o.userData={name,info};scene.add(o);if(info)clickable.push(o);return o}
box('Khuôn viên',0,-1,0,150,1,115,mats.grass);box('Trục đường chính',0,.02,0,8,.08,110,mats.road);box('Đường ngang',0,.03,-4,140,.08,6,mats.road);box('Vành đai phía bắc',0,.03,-48,140,.08,5,mats.road);box('Quảng trường',0,.12,-16,32,.18,22,new THREE.MeshStandardMaterial({color:'#b8a681'}));
function lake(name,x,z,kind){const g=new THREE.Group();g.position.set(x,.1,z);const water=new THREE.Mesh(new THREE.BoxGeometry(20,0.25,13),mats.water);water.userData={name,info:kind};g.add(water);const bank=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(20.4,.28,13.4)),new THREE.LineBasicMaterial({color:'#c9b47f'}));bank.position.y=.08;g.add(bank);scene.add(g);clickable.push(water);for(let i=0;i<(kind==='sen'?14:kind==='sung'?11:0);i++){const a=i*2.4;const px=x+Math.cos(a)*7,pz=z+Math.sin(a)*4;const stem=cyl('cây thủy sinh',px,.35,pz,.035,.5,mats.green);const fl=new THREE.Mesh(new THREE.SphereGeometry(.23,10,6),kind==='sen'?mats.flowerPink:mats.flowerYellow);fl.scale.set(1,.35,1);fl.position.set(px,.7,pz);scene.add(fl)}}
// Cụm 4 hồ trung tâm dựng theo ảnh thực tế: hai hàng hồ chữ nhật, đường đi hình chữ thập ở giữa.
lake('Hồ Tuyệt Vọng · phía tây bắc',-13,-12,'sen');lake('Hồ Hi Vọng · phía đông bắc',13,-12,'sung');lake('Hồ Tình Bạn · phía tây nam',-13,13,'free');lake('Hồ Tình yêu · phía đông nam',13,13,'sen');
// Vòng đường dạo bao quanh cụm hồ và điểm nhấn đài phun nước ở tâm.
const loopMat=new THREE.MeshStandardMaterial({color:'#a99a78'});box('Đường dạo phía bắc',0,.22,-23,58,.14,2,loopMat);box('Đường dạo phía nam',0,.22,24,58,.14,2,loopMat);box('Đường dạo phía tây',-29,.22,0,2,.14,48,loopMat);box('Đường dạo phía đông',29,.22,0,2,.14,48,loopMat);cyl('Đài phun nước Học viện',0,.35,0,2.2,.35,mats.wall,'Đài phun nước Học viện tại giao điểm trung tâm của cụm bốn hồ.');
box('Lối đi dọc giữa 4 hồ',0,.18,0,4,.12,42,mats.road);box('Lối đi ngang giữa 4 hồ',0,.19,0,48,.12,4,mats.road);
function tree(x,z,s=1){cyl('Cây bóng mát',x,2*s,z,.55*s,4*s,mats.trunk);const a=new THREE.Mesh(new THREE.SphereGeometry(2.4*s,12,9),mats.leaf);a.position.set(x,5*s,z);a.castShadow=true;scene.add(a)}for(let z=-50;z<=50;z+=7){tree(-7,z,.7);tree(7,z,.7)}for(let x=-65;x<=65;x+=9){tree(x,-8,.65);tree(x,8,.65)}
function building(name,x,z,w,d,h,info){box(name,x,h/2,z,w,h,d,mats.wall,info);box(name+' mái',x,h+.15,z,w+.5,.35,d+.5,mats.roof);for(let i=-2;i<=2;i++)box('cửa sổ',x+i*w/5,h*.55,z-d/2-.03,.8,1,.08,new THREE.MeshStandardMaterial({color:'#6fcaad'}));}
building('Giảng đường C',-36,-22,22,12,6,'Cụm giảng đường phía tây bắc theo mặt bằng thực tế.');building('Viện Sinh học Nông nghiệp',35,-22,22,14,6,'Công trình phía đông bắc với khối cong đặc trưng.');building('Giảng đường Nguyễn Đăng',22,38,34,12,7,'Giảng đường Nguyễn Đăng nằm phía nam cụm hồ.');building('Khoa Nông học',0,-42,24,10,5,'Khoa Nông học ở phía bắc khu vực mô phỏng.');building('Khu nghiên cứu bảo vệ thực vật',-32,42,20,9,5,'Phòng nghiên cứu, phân tích mẫu cây và học nguyên lý tác động của hoạt chất.');building('Nhà lưới thực nghiệm',32,42,20,9,4,'Nhà lưới kiểm soát điều kiện và khu thực hành sinh viên.');
function garden(x,z){for(let r=0;r<4;r++){box('Luống rau thực hành',x-8+r*5,.25,z,3,.3,15,mats.soil,'Vườn rau màu thực hành: nhận diện cây, giai đoạn sinh trưởng, sâu bệnh và bảo vệ thực vật.');for(let j=0;j<8;j++){cyl('Cây rau',x-8+r*5,.65,z-6+j*1.7,.18,.8,mats.green)}}}garden(0,48);
box('Cổng Học viện',0,3,-55,18,6,2,mats.wall,'Cổng vào mô phỏng Học viện Nông nghiệp Việt Nam. Điểm bắt đầu tuyến tham quan.');box('Biển tên Học viện',0,6,-56,12,1,0.3,mats.roof);
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();renderer.domElement.addEventListener('click',e=>{mouse.x=e.clientX/innerWidth*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;ray.setFromCamera(mouse,cam);const hit=ray.intersectObjects(clickable,true)[0];if(hit){const a=hit.object.userData;document.getElementById('pTitle').textContent=a.name;document.getElementById('pBody').innerHTML='<p>'+a.info+'</p><span class="tag">Mô phỏng học tập</span><span class="tag">VNUA</span>';document.getElementById('panel').style.display='block'}});document.getElementById('close').onclick=()=>document.getElementById('panel').style.display='none';
const views={gate:[0,18,-70],admin:[22,18,-35],agro:[26,18,25],garden:[28,16,55]};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{const p=views[b.dataset.view];cam.position.set(...p);controls.target.set(0,0,0)});addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function loop(){controls.update();renderer.render(scene,cam);requestAnimationFrame(loop)}loop();
</script></body></html>
